name: Build & Release

on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag to release (for example v2.2.0)
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ inputs.tag || github.ref }}
  cancel-in-progress: false

jobs:
  build-release:
    name: Verify and build signed APK & AAB
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - name: Checkout release source
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.ref }}
          fetch-depth: 0

      - name: Validate version and signing configuration
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          set -euo pipefail
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          VERSION=$(sed -n 's/^version: \([^+]*\).*/\1/p' pubspec.yaml)
          test "$RELEASE_TAG" = "v$VERSION"
          for KEY in KEYSTORE_BASE64 KEYSTORE_PASSWORD KEY_PASSWORD KEY_ALIAS; do
            if [ -z "${!KEY}" ]; then
              echo "::error::Missing release signing secret: $KEY"
              exit 1
            fi
          done

      - name: Setup Node for partner database checks
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Verify partner database permissions
        run: |
          npm ci --prefix test/backend/partner-db
          node test/backend/partner-db/validate.mjs

      - name: Setup Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.6'
          channel: stable
          cache: true

      - name: Install locked dependencies
        run: flutter pub get --enforce-lockfile

      - name: Analyze production and test code
        run: flutter analyze lib test --no-pub --no-fatal-infos --no-fatal-warnings

      - name: Test domain and behavior
        run: flutter test --no-pub

      - name: Verify Flutter layouts and capture screenshots
        run: flutter test --no-pub --dart-define=SHOTS=true test/shots/release_screens_shots_test.dart

      - name: Configure release signing
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > android/app/cyclecare-release.jks
          printf 'storePassword=%s\nkeyPassword=%s\nkeyAlias=%s\nstoreFile=%s\n' \
            "$KEYSTORE_PASSWORD" "$KEY_PASSWORD" "$KEY_ALIAS" \
            'cyclecare-release.jks' > android/key.properties

      - name: Build signed APK and app bundle
        run: |
          flutter build apk --release --no-pub
          flutter build appbundle --release --no-pub

      - name: Verify signatures and checksum release files
        run: |
          APK=build/app/outputs/flutter-apk/app-release.apk
          AAB=build/app/outputs/bundle/release/app-release.aab
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -n 1)
          "$APKSIGNER" verify --verbose --print-certs "$APK"
          jarsigner -verify "$AAB"
          mkdir -p build/release
          cp "$APK" "build/release/cyclecare-$RELEASE_TAG.apk"
          cp "$AAB" "build/release/cyclecare-$RELEASE_TAG.aab"
          cd build/release
          sha256sum *.apk *.aab > SHA256SUMS.txt

      - name: Upload verified build and UI evidence
        uses: actions/upload-artifact@v7
        with:
          name: cyclecare-${{ env.RELEASE_TAG }}
          path: |
            build/release/*
            build/shots/release-*.png
          if-no-files-found: error
          retention-days: 30

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          NOTES="docs/releases/${RELEASE_TAG#v}.md"
          test -f "$NOTES"
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" build/release/* --clobber
            gh release edit "$RELEASE_TAG" --title "CycleCare $RELEASE_TAG" --notes-file "$NOTES"
          else
            gh release create "$RELEASE_TAG" build/release/* \
              --verify-tag --title "CycleCare $RELEASE_TAG" --notes-file "$NOTES"
          fi

      - name: Remove signing files
        if: always()
        run: rm -f android/key.properties android/app/cyclecare-release.jks

name: CI

on:
  push:
    branches: [main, develop, 'codex/**']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Analyze & Test
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node for partner database checks
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Verify partner database permissions
        run: |
          npm ci --prefix test/backend/partner-db
          node test/backend/partner-db/validate.mjs

      - name: Setup Flutter 3.41.6
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.6'
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get --enforce-lockfile

      - name: Analyze
        run: flutter analyze lib test --no-fatal-infos --no-fatal-warnings

      - name: Run tests
        run: flutter test --no-pub

      - name: Verify final Flutter layouts
        run: flutter test --no-pub --dart-define=SHOTS=true test/shots/release_screens_shots_test.dart

      - name: Upload Flutter screenshots
        uses: actions/upload-artifact@v7
        with:
          name: flutter-ui-${{ github.sha }}
          path: build/shots/release-*.png
          if-no-files-found: error

  build-debug:
    name: Build Debug APK
    runs-on: ubuntu-latest
    needs: test
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Java 17
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter 3.41.6
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.6'
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get --enforce-lockfile

      - name: Build debug APK
        run: flutter build apk --debug --no-pub

      - name: Upload debug APK
        uses: actions/upload-artifact@v7
        with:
          name: cyclecare-debug-${{ github.sha }}
          path: build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 7

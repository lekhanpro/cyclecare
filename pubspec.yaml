name: cyclecare
description: CycleCare – privacy-first menstrual health, fertility, wellness & AI companion app.
publish_to: 'none'
version: 2.1.0+2

environment:
  # Floors match the resolved lockfile. Flutter 3.38+ is required for the
  # CardThemeData/DialogThemeData/TabBarThemeData renames and google_fonts 8.
  sdk: '>=3.10.0 <4.0.0'
  flutter: '>=3.38.0'

dependencies:
  flutter:
    sdk: flutter

  # ── State management ──────────────────────────────────────────────────────
  # Providers are hand-written, so riverpod_annotation/riverpod_generator are
  # deliberately absent — there is no build_runner step in this project.
  flutter_riverpod: ^2.5.1

  # ── Navigation ────────────────────────────────────────────────────────────
  go_router: ^17.5.0

  # ── Local storage (offline-first) ─────────────────────────────────────────
  shared_preferences: ^2.5.5
  path_provider: ^2.1.6
  path: ^1.9.0

  # ── Backend ───────────────────────────────────────────────────────────────
  supabase_flutter: ^2.17.2

  # ── Auth ──────────────────────────────────────────────────────────────────
  firebase_core: ^4.14.0
  firebase_auth: ^6.6.1
  firebase_messaging: ^16.6.0
  google_sign_in: ^7.2.0

  # ── Network ───────────────────────────────────────────────────────────────
  dio: ^5.11.0
  http: ^1.2.2
  connectivity_plus: ^7.3.1

  # ── UI ────────────────────────────────────────────────────────────────────
  # The calendar, cycle ring and week strip are first-party widgets in
  # lib/widgets, so no third-party calendar or animation kit is pulled in.
  google_fonts: ^8.1.0
  fl_chart: ^1.2.0

  # ── Notifications ─────────────────────────────────────────────────────────
  flutter_local_notifications: ^22.3.0
  timezone: ^0.11.1

  # ── Security ──────────────────────────────────────────────────────────────
  local_auth: ^3.0.2
  flutter_secure_storage: ^10.3.1

  # ── Utilities ─────────────────────────────────────────────────────────────
  intl: ^0.20.3
  uuid: ^4.6.0
  crypto: ^3.0.6
  share_plus: ^13.3.0
  url_launcher: ^6.3.1
  permission_handler: ^13.0.1
  image_picker: ^1.2.3
  flutter_dotenv: ^6.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.1

flutter:
  uses-material-design: true

  assets:
    - assets/
    - assets/images/
    - assets/lottie/
    - assets/education/

  # Fonts served via google_fonts package at runtime (no bundled assets needed)

flutter_launcher_icons:
  android: true
  ios: true
  remove_alpha_ios: true
  image_path: "assets/images/app_icon.png"
  min_sdk_android: 21
  adaptive_icon_background: "#E86F91"
  # Must be the transparent mark, not the full tile - passing app_icon.png here
  # bakes the rose background into the adaptive foreground layer and double-draws
  # it over adaptive_icon_background.
  adaptive_icon_foreground: "assets/images/app_icon_foreground.png"

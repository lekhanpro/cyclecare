name: cyclecare
description: CycleCare – privacy-first menstrual health, fertility, wellness & AI companion app.
publish_to: 'none'
version: 2.2.0+3

environment:
  # Floors match the resolved lockfile. Flutter 3.38+ is required for the
  # CardThemeData/DialogThemeData/TabBarThemeData renames and google_fonts 8.
  sdk: '>=3.10.0 <4.0.0'
  flutter: '>=3.38.0'

dependencies:
  flutter:
    sdk: flutter

  # ── State management ──────────────────────────────────────────────────────
  # Providers are hand-written, so riverpod_annotation/riverpod_generator are
  # deliberately absent — there is no build_runner step in this project.
  flutter_riverpod: ^3.4.3

  # ── Navigation ────────────────────────────────────────────────────────────
  go_router: ^17.5.0

  # ── Local storage (offline-first) ─────────────────────────────────────────
  shared_preferences: ^2.5.6
  path_provider: ^2.1.6
  path: ^1.9.0

  # ── Backend ───────────────────────────────────────────────────────────────
  supabase_flutter: ^2.18.3

  # ── Auth ──────────────────────────────────────────────────────────────────
  firebase_core: ^5.1.0
  firebase_auth: ^7.0.1
  firebase_messaging: ^17.0.1
  google_sign_in: ^7.2.0

  # ── Network ───────────────────────────────────────────────────────────────
  dio: ^5.11.1
  http: ^1.2.2
  connectivity_plus: ^7.3.1

  # ── UI ────────────────────────────────────────────────────────────────────
  # The calendar, cycle ring and week strip are first-party widgets in
  # lib/widgets, so no third-party calendar or animation kit is pulled in.
  google_fonts: ^9.0.0
  fl_chart: ^1.3.0

  # ── Notifications ─────────────────────────────────────────────────────────
  flutter_local_notifications: ^22.3.3
  timezone: ^0.11.2
  flutter_timezone: ^5.1.1

  # ── Security ──────────────────────────────────────────────────────────────
  local_auth: ^3.0.2
  flutter_secure_storage: ^10.3.4

  # ── Utilities ─────────────────────────────────────────────────────────────
  intl: ^0.20.3
  uuid: ^4.6.0
  crypto: ^3.0.8
  share_plus: ^13.3.1
  url_launcher: ^6.3.1
  permission_handler: ^13.0.2
  image_picker: ^1.2.4
  flutter_dotenv: ^6.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.1

flutter:
  uses-material-design: true

  assets:
    - assets/
    - assets/images/
    - assets/lottie/
    - assets/education/
    - assets/pets/

  # Bundled rather than fetched at runtime. The approved design is built on
  # Fraunces and DM Sans, and google_fonts downloads a family on first use —
  # which fails on a device that is offline, and offline tracking without an
  # account is a product invariant. Only the weights the design uses ship.
  fonts:
    - family: DM Sans
      fonts:
        - asset: assets/fonts/DMSans-Regular.ttf
          weight: 400
        - asset: assets/fonts/DMSans-Medium.ttf
          weight: 500
        - asset: assets/fonts/DMSans-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/DMSans-Bold.ttf
          weight: 700
    - family: Fraunces
      fonts:
        - asset: assets/fonts/Fraunces-Regular.ttf
          weight: 400
        - asset: assets/fonts/Fraunces-Medium.ttf
          weight: 500
    # The redesign's 168 semantic icons, compiled from tool/icons/svg by
    # tool/icons/build_icon_font.py. Read through AppIcons, never directly.
    - family: CycleCareIcons
      fonts:
        - asset: assets/fonts/CycleCareIcons.ttf

flutter_launcher_icons:
  android: true
  ios: true
  remove_alpha_ios: true
  image_path: "assets/images/app_icon.png"
  min_sdk_android: 21
  adaptive_icon_background: "#E86F91"
  # Must be the transparent mark, not the full tile - passing app_icon.png here
  # bakes the rose background into the adaptive foreground layer and double-draws
  # it over adaptive_icon_background.
  adaptive_icon_foreground: "assets/images/app_icon_foreground.png"

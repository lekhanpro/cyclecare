name: cyclecare
description: CycleCare – privacy-first menstrual health, fertility, wellness & AI companion app.
publish_to: 'none'
version: 2.1.0+2

environment:
  # Floors match the resolved lockfile. Flutter 3.38+ is required for the
  # CardThemeData/DialogThemeData/TabBarThemeData renames and google_fonts 8.
  sdk: '>=3.10.0 <4.0.0'
  flutter: '>=3.38.0'

dependencies:
  flutter:
    sdk: flutter

  # ── State management ──────────────────────────────────────────────────────
  # Providers are hand-written, so riverpod_annotation/riverpod_generator are
  # deliberately absent — there is no build_runner step in this project.
  flutter_riverpod: ^2.5.1

  # ── Navigation ────────────────────────────────────────────────────────────
  go_router: ^14.2.7

  # ── Local storage (offline-first) ─────────────────────────────────────────
  shared_preferences: ^2.3.2
  path_provider: ^2.1.4
  path: ^1.9.0

  # ── Backend ───────────────────────────────────────────────────────────────
  supabase_flutter: ^2.5.6

  # ── Auth ──────────────────────────────────────────────────────────────────
  firebase_core: ^3.8.1
  firebase_auth: ^5.4.1
  firebase_messaging: ^15.1.5
  google_sign_in: ^6.2.2

  # ── Network ───────────────────────────────────────────────────────────────
  dio: ^5.7.0
  http: ^1.2.2
  connectivity_plus: ^6.1.0

  # ── UI ────────────────────────────────────────────────────────────────────
  # The calendar, cycle ring and week strip are first-party widgets in
  # lib/widgets, so no third-party calendar or animation kit is pulled in.
  google_fonts: ^8.1.0
  fl_chart: ^0.69.0

  # ── Notifications ─────────────────────────────────────────────────────────
  flutter_local_notifications: ^18.0.1
  timezone: ^0.9.4

  # ── Security ──────────────────────────────────────────────────────────────
  local_auth: ^2.3.0
  flutter_secure_storage: ^9.2.3

  # ── Utilities ─────────────────────────────────────────────────────────────
  intl: ^0.19.0
  uuid: ^4.5.1
  crypto: ^3.0.6
  share_plus: ^10.1.4
  url_launcher: ^6.3.1
  permission_handler: ^11.3.1
  image_picker: ^1.1.2
  flutter_dotenv: ^5.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.1

flutter:
  uses-material-design: true

  assets:
    - assets/
    - assets/images/
    - assets/lottie/
    - assets/education/

  # Fonts served via google_fonts package at runtime (no bundled assets needed)

flutter_launcher_icons:
  android: true
  ios: true
  remove_alpha_ios: true
  image_path: "assets/images/app_icon.png"
  min_sdk_android: 21
  adaptive_icon_background: "#E86F91"
  # Must be the transparent mark, not the full tile - passing app_icon.png here
  # bakes the rose background into the adaptive foreground layer and double-draws
  # it over adaptive_icon_background.
  adaptive_icon_foreground: "assets/images/app_icon_foreground.png"
